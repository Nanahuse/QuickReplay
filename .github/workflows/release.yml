name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Detect version change
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current = (uv version --short).Trim()
          if ([string]::IsNullOrWhiteSpace($current)) {
            throw "Current project version is empty."
          }
          "version=$current" >> $env:GITHUB_OUTPUT
          $tag = "v$current"
          $tagResponse = gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --include 2>&1
          $tagExitCode = $LASTEXITCODE
          $LASTEXITCODE = 0
          if ($tagExitCode -eq 0) {
            $tagExists = $true
          } elseif ($tagResponse -match "404|Not Found") {
            $tagExists = $false
          } else {
            throw "Failed to check tag $tag: $tagResponse"
          }

          $releaseResponse = gh api "repos/${{ github.repository }}/releases/tags/$tag" --include 2>&1
          $releaseExitCode = $LASTEXITCODE
          $LASTEXITCODE = 0
          if ($releaseExitCode -eq 0) {
            $releaseExists = $true
          } elseif ($releaseResponse -match "404|Not Found") {
            $releaseExists = $false
          } else {
            throw "Failed to check release $tag: $releaseResponse"
          }

          if ($releaseExists -and -not $tagExists) {
            throw "Inconsistent release state: release $tag exists without its tag."
          }

          $releaseRequired = -not $releaseExists
          $tagRequired = -not $tagExists
          "release_required=$($releaseRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag_required=$($tagRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Tag exists: $tagExists; release exists: $releaseExists"

      - name: Build Windows app
        if: steps.version.outputs.release_required == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run flet clean
          uv run flet build windows --python-version 3.14 --yes

      - name: Create portable distribution ZIP
        if: steps.version.outputs.release_required == 'true'
        run: uv run python tools/package_windows_release.py

      - name: Verify release ZIP
        if: steps.version.outputs.release_required == 'true'
        shell: pwsh
        run: |
          $zip = "dist/QuickReplay-${{ steps.version.outputs.version }}-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "Release ZIP was not generated: $zip" }

      - name: Create tag
        if: steps.version.outputs.tag_required == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$env:VERSION" "${{ github.sha }}" -m "QuickReplay v$env:VERSION"
          git push origin "v$env:VERSION"

      - name: Create GitHub Release
        if: steps.version.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $zip = "dist/QuickReplay-${{ steps.version.outputs.version }}-windows-x64.zip"
          gh release create $tag $zip --repo "${{ github.repository }}" --verify-tag --title "QuickReplay $tag" --generate-notes
