[project]
name = "quickreplay"
version = "2.0.0"
description = "Desktop instant replay application for NDI inputs"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "av>=18.1.0",
    "flet==1.0.0",
    "ndi-python==6.3.2.4",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickreplay"]

[tool.flet]
product = "QuickReplay"

[tool.flet.app]
path = "src"
module = "main"
hide_window_on_start = true

[tool.flet.windows]
artifact = "QuickReplay"

[tool.flet.windows.compile]
packages = false

[tool.flet.windows.cleanup]
packages = false

[dependency-groups]
dev = [
    "flet-cli==1.0.0",
    "flet-desktop==1.0.0",
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.1a",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
