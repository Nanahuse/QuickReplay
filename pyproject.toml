[project]
name = "quickreplay"
version = "2.0.0.dev0"
description = "QuickReplay Version 2 (under development)"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "av>=18.1.0",
    "flet==1.0.0",
    "ndi-python==6.3.2.4",
    "numpy>=2.5.3",
    "opencv-python==4.14.0.94",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickreplay"]

[dependency-groups]
dev = [
    "flet-cli==1.0.0",
    "flet-desktop==1.0.0",
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.1a",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
